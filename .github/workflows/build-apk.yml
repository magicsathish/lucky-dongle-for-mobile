name: ARM64 Only Release APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build ARM64 Release APK
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set Up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Detect Android Project Root
    id: project
    shell: bash
    run: |
      set -e

      ROOT=""

      if [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; then
        ROOT="."
      else
        while IFS= read -r file; do
          candidate="$(dirname "$file")"
          if [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ]; then
            ROOT="$candidate"
            break
          fi
        done < <(find . -type f -name settings.gradle -o -name settings.gradle.kts -not -path '*/.gradle/*')
      fi

      if [ -z "$ROOT" ]; then
        echo "ERROR: Android Gradle project root not found."
        exit 1
      fi

      echo "Project root: $ROOT"
      echo "root=$ROOT" >> "$GITHUB_OUTPUT"

  - name: Validate Android Project
    working-directory: ${{ steps.project.outputs.root }}
    shell: bash
    run: |
      set -e
      test -f gradlew
      test -f app/build.gradle || test -f app/build.gradle.kts
      chmod +x gradlew

  - name: Build ARM64 Release APK
    working-directory: ${{ steps.project.outputs.root }}
    shell: bash
    run: |
      ./gradlew :app:assembleRelease \
        -PreactNativeArchitectures=arm64-v8a \
        -Pandroid.injected.build.abi=arm64-v8a \
        --no-daemon \
        --stacktrace

  - name: Verify APK ABI
    working-directory: ${{ steps.project.outputs.root }}
    shell: bash
    run: |
      set -e

      APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)

      if [ -z "$APK" ]; then
        echo "ERROR: Release APK not found."
        exit 1
      fi

      echo "APK: $APK"
      ls -lh "$APK"

      if ! command -v unzip >/dev/null 2>&1; then
        sudo apt-get update
        sudo apt-get install -y unzip
      fi

      echo "Native ABI directories:"
      unzip -Z1 "$APK" | grep '^lib/' | cut -d/ -f2 | sort -u || true

      ABI_LIST=$(unzip -Z1 "$APK" | grep '^lib/' | cut -d/ -f2 | sort -u)

      if [ "$ABI_LIST" != "arm64-v8a" ]; then
        echo "ERROR: APK contains unexpected ABIs:"
        echo "$ABI_LIST"
        exit 1
      fi

      echo "SUCCESS: ARM64-only APK verified."

  - name: Upload ARM64 APK
    uses: actions/upload-artifact@v4
    with:
      name: Lucky-Dongle-Browser-ARM64-Release
      path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/release/*.apk
      if-no-files-found: error
      retention-days: 14
