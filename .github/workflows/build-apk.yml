name: Lucky Dangle Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: lucky-dangle-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Extract Android Project and Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Safely extract ZIP and detect Android project root
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          extract_dir = Path(os.environ["RUNNER_TEMP"]) / "lucky-dangle-extracted"
          if extract_dir.exists():
              shutil.rmtree(extract_dir)
          extract_dir.mkdir(parents=True)

          # One ZIP upload is expected in the repository root.
          archives = sorted(p for p in workspace.glob("*.zip") if p.is_file())
          if len(archives) != 1:
              raise SystemExit(
                  "Expected exactly one ZIP file in the repository root; "
                  f"found {len(archives)}: {[p.name for p in archives]}"
              )

          archive = archives[0]
          print(f"ZIP found: {archive.name}")

          # Reject unsafe paths before extracting archive contents.
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  member = PurePosixPath(name)
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(f"Unsafe ZIP entry rejected: {info.filename}")
                  target = (extract_dir / Path(*member.parts)).resolve()
                  if extract_dir.resolve() not in target.parents and target != extract_dir.resolve():
                      raise SystemExit(f"ZIP entry escapes extraction folder: {info.filename}")
              zf.extractall(extract_dir)

          # Find the real project root, even if it is several folders deep.
          candidates = []
          for settings_file in list(extract_dir.rglob("settings.gradle.kts")) + list(extract_dir.rglob("settings.gradle")):
              root = settings_file.parent
              app_gradle = root / "app" / "build.gradle.kts"
              app_gradle_groovy = root / "app" / "build.gradle"
              manifest = root / "app" / "src" / "main" / "AndroidManifest.xml"
              if (app_gradle.is_file() or app_gradle_groovy.is_file()) and manifest.is_file():
                  candidates.append(root.resolve())

          # Remove duplicate paths while preserving order.
          candidates = list(dict.fromkeys(candidates))
          if len(candidates) != 1:
              raise SystemExit(
                  "Could not identify one unique Android project root. "
                  f"Valid project roots found: {[str(p) for p in candidates]}"
              )

          project_dir = candidates[0]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PROJECT_DIR={project_dir}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"project_dir={project_dir}\n")

          print(f"Detected Android project root: {project_dir}")
          print("Verified: settings file, app Gradle file, and AndroidManifest.xml are present.")
          PY

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 4. Prepare Android SDK API 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory was not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          # Accept licences, then install the exact SDK packages required by this project.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

          test -d "$SDK_ROOT/platforms/android-37"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          echo "Android SDK API 37 and Build Tools 36.0.0 are ready."

      - name: 5. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 6. Build Lucky Dangle Debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Building project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK build completed successfully."

      - name: 7. Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucky-Dangle-Android-Debug-APK
          path: ${{ steps.detect.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 8. Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lucky-dangle-apk-${{ github.run_number }}
          name: Lucky Dangle APK Build ${{ github.run_number }}
          body: |
            Automated Lucky Dangle Android Debug APK build.

            - Android project root was detected automatically from the uploaded ZIP.
            - Android Gradle Plugin: 9.1.1
            - Gradle: 9.3.1
            - Compile SDK: 37
            - Java: 17
            - Build variant: debug
          files: ${{ steps.detect.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
