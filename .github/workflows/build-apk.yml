name: Lucky Dangle Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: lucky-dangle-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Find ZIP, detect Android project, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Find ZIP anywhere in repository and detect project root
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          extract_dir = runner_temp / "lucky-dangle-extracted"
          if extract_dir.exists():
              shutil.rmtree(extract_dir)
          extract_dir.mkdir(parents=True)

          # Search recursively, not just in the repository root.
          ignored = {".git", ".gradle", "build", "node_modules"}
          archives = sorted(
              p for p in workspace.rglob("*")
              if p.is_file()
              and p.suffix.lower() == ".zip"
              and not any(part in ignored for part in p.relative_to(workspace).parts)
          )

          print("Repository ZIP files found:")
          for item in archives:
              print(f" - {item.relative_to(workspace)}")

          if len(archives) == 0:
              print("Repository root entries:")
              for item in sorted(workspace.iterdir()):
                  print(f" - {item.name}{'/' if item.is_dir() else ''}")
              raise SystemExit(
                  "ERROR: No ZIP file exists in the checked-out repository. "
                  "Upload and COMMIT the ZIP file to GitHub, then rerun the workflow."
              )
          if len(archives) > 1:
              raise SystemExit(
                  "ERROR: More than one ZIP file was found. Keep only the one package ZIP "
                  "for this build, or remove the old ZIP from the repository."
              )

          archive = archives[0]
          print(f"Selected ZIP: {archive.relative_to(workspace)}")

          # Validate all archive paths before extracting.
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  member = PurePosixPath(name)
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(f"Unsafe ZIP entry rejected: {info.filename}")
                  target = (extract_dir / Path(*member.parts)).resolve()
                  if extract_dir.resolve() not in target.parents and target != extract_dir.resolve():
                      raise SystemExit(f"ZIP entry escapes extraction folder: {info.filename}")
              zf.extractall(extract_dir)

          print("ZIP extraction completed. Searching for Android project files...")
          candidates = []
          settings_files = list(extract_dir.rglob("settings.gradle.kts"))
          settings_files += list(extract_dir.rglob("settings.gradle"))
          for settings_file in settings_files:
              root = settings_file.parent
              has_app_gradle = (
                  (root / "app" / "build.gradle.kts").is_file()
                  or (root / "app" / "build.gradle").is_file()
              )
              has_manifest = (root / "app" / "src" / "main" / "AndroidManifest.xml").is_file()
              if has_app_gradle and has_manifest:
                  candidates.append(root.resolve())

          candidates = list(dict.fromkeys(candidates))
          if len(candidates) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one Android project root inside the ZIP. "
                  f"Found: {[str(p) for p in candidates]}"
              )

          project_dir = candidates[0]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PROJECT_DIR={project_dir}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"project_dir={project_dir}\n")

          print(f"SUCCESS: Android project root detected: {project_dir}")
          print("Required settings file, app Gradle file, and AndroidManifest.xml are present.")
          PY

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Gradle project is extracted into RUNNER_TEMP, not the repository checkout.
          # Do not enable setup-java's Gradle cache dependency-file scan here.

      - name: 4. Install Android SDK API 37 and Build Tools 36.0.0
        uses: android-actions/setup-android@v3

      - name: 5. Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"
          test -d "${ANDROID_HOME}/platforms/android-37"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

      - name: 6. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 7. Build Lucky Dangle Debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Android project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK build completed and APK file verified."

      - name: 8. Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucky-Dangle-Android-Debug-APK
          path: ${{ steps.detect.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 9. Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lucky-dangle-apk-${{ github.run_number }}
          name: Lucky Dangle APK Build ${{ github.run_number }}
          body: |
            Automated Lucky Dangle Android Debug APK build.
            - Android project root detected automatically inside the uploaded ZIP.
            - Android Gradle Plugin: 9.1.1
            - Gradle: 9.3.1
            - Compile SDK: 37
            - Java: 17
            - Build variant: debug
          files: ${{ steps.detect.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
