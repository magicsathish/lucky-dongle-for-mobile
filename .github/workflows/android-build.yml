name: Lucky Dangle Browser - Android APK Build

on:
  workflow_dispatch:

  push:
    paths:
      - 'LuckyDangleBrowser_Android_v1.0.0.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Lucky Dangle Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Required Android SDK Components
      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --update
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 5. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
          adb version

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13.2'

      # 7. Verify ZIP File
      - name: Verify Project ZIP
        run: |
          test -f LuckyDangleBrowser_Android_v1.0.0.zip
          unzip -t LuckyDangleBrowser_Android_v1.0.0.zip

      # 8. Extract Android Project
      - name: Extract Project ZIP
        run: |
          mkdir -p extracted

          unzip -q LuckyDangleBrowser_Android_v1.0.0.zip \
            -d extracted

          test -f extracted/LuckyDangleBrowser_Android_v1.0.0/settings.gradle.kts

      # 9. Verify Project Files
      - name: Verify Android Project
        run: |
          PROJECT="extracted/LuckyDangleBrowser_Android_v1.0.0"

          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo "Project verification successful!"

      # 10. Build APK
      - name: Build Debug APK
        working-directory: extracted/LuckyDangleBrowser_Android_v1.0.0
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # 11. Verify APK
      - name: Verify APK Output
        run: |
          APK="extracted/LuckyDangleBrowser_Android_v1.0.0/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Lucky-Dangle-Browser-Android-v1.0.0
          path: extracted/LuckyDangleBrowser_Android_v1.0.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 13. Build Summary
      - name: Build Summary
        if: success()
        run: |
          echo "## Lucky Dangle Browser APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Android APK generated successfully." >> $GITHUB_STEP_SUMMARY
          echo "Version: 1.0.0" >> $GITHUB_STEP_SUMMARY
