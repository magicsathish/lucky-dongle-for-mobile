name: Lucky Dangle Browser - Android APK Build

on:
  workflow_dispatch:

  push:
    paths:
      - 'LuckyDangleBrowser_Android_v1.0.0.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Lucky Dangle Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Detect Existing Android SDK
      - name: Detect Android SDK
        shell: bash
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            else
              echo "ERROR: Android SDK directory not found!"
              exit 1
            fi
          else
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi

          echo "Android SDK location detected."

      # 4. Locate SDK Manager
      - name: Locate SDK Manager
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER=$(find "$SDK_ROOT" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            echo "SDK location: $SDK_ROOT"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "SDK Manager detected successfully."

      # 5. Accept SDK Licenses
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      # 6. Install Required SDK Components
      - name: Install Android SDK Components
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 7. Verify Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -f "$ANDROID_HOME/platform-tools/adb"

          "$ANDROID_HOME/platform-tools/adb" version

          echo "Android SDK verification successful."

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13.2'

      # 9. Verify Project ZIP
      - name: Verify Project ZIP
        shell: bash
        run: |
          test -f "LuckyDangleBrowser_Android_v1.0.0.zip"

          unzip -t LuckyDangleBrowser_Android_v1.0.0.zip

      # 10. Extract Project
      - name: Extract Android Project
        shell: bash
        run: |
          mkdir -p extracted

          unzip -q \
            LuckyDangleBrowser_Android_v1.0.0.zip \
            -d extracted

      # 11. Verify Project Structure
      - name: Verify Android Project
        shell: bash
        run: |
          PROJECT="extracted/LuckyDangleBrowser_Android_v1.0.0"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo "Project structure verified."

      # 12. Build APK
      - name: Build Debug APK
        working-directory: extracted/LuckyDangleBrowser_Android_v1.0.0
        shell: bash
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # 13. Verify APK
      - name: Verify APK Output
        shell: bash
        run: |
          APK="extracted/LuckyDangleBrowser_Android_v1.0.0/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Lucky-Dangle-Browser-Android-v1.0.0
          path: extracted/LuckyDangleBrowser_Android_v1.0.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 15. Build Summary
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "## Lucky Dangle APK Build Successful!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 1.0.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: Android" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: Debug APK" >> "$GITHUB_STEP_SUMMARY"
