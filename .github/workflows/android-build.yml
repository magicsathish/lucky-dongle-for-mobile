name: Lucky Dangle Browser APK Builder

on:
  workflow_dispatch:

  push:
    paths:
      - 'LuckyDangleBrowser_Android_v1.0.0.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project ZIP
        run: |
          unzip -q LuckyDangleBrowser_Android_v1.0.0.zip -d extracted

          cp -R extracted/LuckyDangleBrowser_Android_v1.0.0/. .

      - name: Verify Project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lucky-Dangle-Browser-APK-v1.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
