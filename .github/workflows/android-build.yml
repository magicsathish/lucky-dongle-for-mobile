name: Lucky Dangle Browser - Android APK Build

on:
  workflow_dispatch:

  push:
    paths:
      - 'LuckyDangleBrowser_Android_v1.0.0.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Lucky Dangle Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Required Android SDK Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed
          adb version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13.2'

      - name: Verify Project ZIP
        run: |
          if [ ! -f "LuckyDangleBrowser_Android_v1.0.0.zip" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          unzip -t LuckyDangleBrowser_Android_v1.0.0.zip

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted

          unzip -q \
            LuckyDangleBrowser_Android_v1.0.0.zip \
            -d extracted

      - name: Verify Android Project Files
        run: |
          PROJECT="extracted/LuckyDangleBrowser_Android_v1.0.0"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo "Android project verification successful!"

      - name: Build Debug APK
        working-directory: extracted/LuckyDangleBrowser_Android_v1.0.0
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK Output
        run: |
          APK="extracted/LuckyDangleBrowser_Android_v1.0.0/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Lucky-Dangle-Browser-Android-v1.0.0
          path: extracted/LuckyDangleBrowser_Android_v1.0.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "## Lucky Dangle Browser APK Build Successful!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Android APK generated successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "Version: 1.0.0" >> "$GITHUB_STEP_SUMMARY"
